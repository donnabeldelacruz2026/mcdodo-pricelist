<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCDODO Price List</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Papa Parse -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.4/papaparse.min.js"></script>
</head>
<body>

<header>
    <div class="container">
        <div class="logo-container">
            <img src="images/MCDODO_LOGO.png" alt="MCDODO Logo" class="logo">
            <p class="subtitle">Official Dealer & Reseller Price List</p>
        </div>

<input
    type="text"
    id="search"
    placeholder="Search Product Name, Model Number, or Item Code..."
>

    <div id="categories"></div>
    </div>
    
    <button id="cartButton" class="cart-button" style="display:none;">
    🛒 Cart
    <span id="cartCount">0</span>
    </button>
    
</header>

<main class="container">
    <div id="product-list"></div>
</main>

<div id="productModal" class="modal">
        <div class="modal-content">
                <span class="close">&times;</span>
                <div id="modalBody"></div>

        </div>
</div>

    <div id="cartModal" class="cart-modal">

    <div class="cart-modal-content">

        <span class="cart-close">&times;</span>

        <h2>🛒 Shopping Cart</h2>

        <div id="cartItems"></div>

        <div class="cart-total">
            <span>Total</span>
            <strong id="cartTotal">₱0</strong>
        </div>

        <button id="clearCart" class="clear-cart-btn">
            Clear Cart
        </button>

    </div>

</div>
    
<script src="script.js"></script>
    

</body>
</html>
